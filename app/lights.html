<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote State Monitor</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column; /* Stack items vertically */
            align-items: center;
            background-color: #1a1a1a;
        }

        /* Header (logo + text) */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            max-width: 200px; /* Adjust size as needed */
            height: auto;
            display: block;
            margin: 0 auto 10px auto; /* Center + space below */
        }

        .header-text {
            color: white;
            font-size: 1.5rem;
        }

        /* Container ensures circles are evenly spaced */
        .container {
            display: flex;
            justify-content: space-evenly;
            width: 100%;
            max-width: 900px;
        }

        .status-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #333;
            transition: background-color 0.5s ease, box-shadow 0.5s ease;
            margin-bottom: 20px;
        }

        .plaque {
            background: linear-gradient(145deg, #d4af37, #b8860b);
            color: #2c2c2c;
            padding: 10px 20px;
            border-radius: 4px;
            border: 2px solid #8b6508;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 140px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            font-size: 0.9rem;
        }

        .status-red {
            background-color: #ff4d4d;
            box-shadow: 0 0 20px #ff4d4d;
        }

        .status-green {
            background-color: #2ecc71;
            box-shadow: 0 0 20px #2ecc71;
        }
    </style>
</head>

<body>

    <!-- ✅ New Header Section -->
    <div class="header">
        <img src="logo2.png" alt="Logo" class="logo">
        <div class="header-text">Hurry! Return all three artefacts to their correct time, and enter the calibration code to get back to the present day!</div>
    </div>

    <!-- Existing Content -->
    <div class="container">
        <div class="status-group">
            <div id="circle-0" class="circle status-red"></div>
            <div id="plaque-0" class="plaque">Artefact 1</div>
        </div>

        <div class="status-group">
            <div id="circle-1" class="circle status-red"></div>
            <div id="plaque-1" class="plaque">Artefact 2</div>
        </div>

        <div class="status-group">
            <div id="circle-2" class="circle status-red"></div>
            <div id="plaque-2" class="plaque">Artefact 3</div>
        </div>
    </div>

    <script>
        const API_URL = "/colors";
        const REFRESH_RATE = 1000;

        async function updateDashboard() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response was not ok');

                const data = await response.json();

                data.found.forEach((found, index) => {
                    const circle = document.getElementById(`circle-${index}`);
                    if (circle) {
                        circle.className = 'circle';
                        if (found) {
                            circle.classList.add('status-green');
                        } else {
                            circle.classList.add('status-red');
                        }
                    }
                });
            } catch (error) {
                console.error("Failed to sync with server:", error);
            }
        }

        updateDashboard();
        setInterval(updateDashboard, REFRESH_RATE);
    </script>

</body>
</html>
