<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Escape Room - Stage 2</title>

<style>
body {
    background-color: #0b0f14;
    color: #e6edf3;
    font-family: Arial;
    text-align: center;
    margin-top: 100px;
}

.container {
    background: #111827;
    padding: 30px;
    border-radius: 12px;
    display: inline-block;
}

img {
    width: 250px;
    margin-bottom: 20px;
}

.message {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png">

<h1>Enter Calibration Code</h1>

<input type="password" id="password2" autocomplete="new-password"><br><br>

<label>
    <input type="checkbox" id="checkbox2">
    All patrons present
</label>
<br><br>

<button onclick="checkPassword2()">Submit</button>

<div class="message" id="message2"></div>

</div>

<audio id="successSound" src="success.mp3"></audio>
<audio id="errorSound" src="error.mp3"></audio>

<script>
async function checkPassword2() {
    const password = document.getElementById("password2").value;
    const checkbox = document.getElementById("checkbox2").checked;
    const message = document.getElementById("message2");

    const res = await fetch("/colors");
    const data = await res.json();

    if (password !== "5123") {
        message.style.color = "#ff4d4d";
        message.innerText = "❌ Wrong code.";
        errorSound.play();
        return;
    }

    if (!checkbox) {
        message.style.color = "#ff4d4d";
        message.innerText = "⚠️ All patrons must be present!";
        errorSound.play();
        return;
    }

    if (!data.found[0] || !data.found[1] || !data.found[2]) {
        message.style.color = "#ff4d4d";
        message.innerText = "🧩 Artefacts in the wrong time...";
        errorSound.play();
        return;
    }

    // ✅ SUCCESS
    message.style.color = "#00ffae";
    message.innerText = "🎉 Time disturbance resolved! Initiating Time Travel Protocols...";
    successSound.play();

    // Redirect back to holding page after a short delay
    setTimeout(() => {
        window.location.href = "holding.html";
    }, 3000); // 3 seconds (adjust if you want)
}
</script>

</body>
</html>
