<script>
async function checkState() {
    console.log("hi")
    try {
        const res = await fetch("/stage");
        const data = await res.json();

        if (data.stage === "start") {
            window.location.href = "password-entry.html";
        }
    } catch (err) {
        console.log("Server not ready");
    }
}

// Check every 2 seconds
setInterval(checkState, 2000);
</script>
