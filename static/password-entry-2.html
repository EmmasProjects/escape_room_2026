<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Escape Room - Stage 2</title>

<style>
body {
    background-color: #0b0f14;
    color: #e6edf3;
    font-family: Arial;
    text-align: center;
    margin-top: 100px;
}

.container {
    background: #111827;
    padding: 30px;
    border-radius: 12px;
    display: inline-block;
}

img {
    width: 180px;
    margin-bottom: 20px;
}

.message {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png">

<h2>Stage 2: Final Password</h2>

<input type="password" id="password2"><br><br>

<label>
    <input type="checkbox" id="checkbox2">
    All time travellers present
</label>
<br><br>

<button onclick="checkPassword2()">Submit</button>

<div class="message" id="message2"></div>

</div>

<audio id="successSound" src="success.mp3"></audio>
<audio id="errorSound" src="error.mp3"></audio>

<script>
function checkPassword2() {
    const password = document.getElementById("password2").value;
    const checkbox = document.getElementById("checkbox2").checked;
    const message = document.getElementById("message2");

    if (password === "abcde") {
        if (!checkbox) {
            message.style.color = "#ff4d4d";
            message.innerText = "⚠️ All time travellers must be present!";
            document.getElementById("errorSound").play();
            return;
        }

        message.style.color = "#00ffae";
        message.innerText = "🎉 You escaped!";
        document.getElementById("successSound").play();
    } else {
        message.style.color = "#ff4d4d";
        message.innerText = "❌ Wrong code.";
        document.getElementById("errorSound").play();
    }
}
</script>

</body>
</html>
