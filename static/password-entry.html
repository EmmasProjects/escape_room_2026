<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Escape Room - Stage 1</title>

<style>
body {
    background-color: #0b0f14;
    color: #e6edf3;
    font-family: Arial;
    text-align: center;
    margin-top: 100px;
}

.container {
    background: #111827;
    padding: 30px;
    border-radius: 12px;
    display: inline-block;
}

img {
    width: 250px;
    margin-bottom: 20px;
}

.message {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png">

<h1>Enter Calibration Code</h1>

<input type="password" id="password1"><br><br>

<label>
    <input type="checkbox" id="checkbox1">
    All patrons present
</label>
<br><br>

<button onclick="checkPassword1()">Submit</button>

<div class="message" id="message1"></div>

</div>

<audio id="successSound" src="success.mp3"></audio>
<audio id="errorSound" src="error.mp3"></audio>

<script>

async function checkPassword1() {
    const password = document.getElementById("password1").value;
    const checkbox = document.getElementById("checkbox1").checked;
    const message = document.getElementById("message1");

    const res = await fetch("/colors");
    const data = await res.json();

    if (password !== "12345") {
        message.style.color = "#ff4d4d";
        message.innerText = "❌ Incorrect calibration code...";
        errorSound.play();
        return;
    }

    if (!checkbox) {
        message.style.color = "#ff4d4d";
        message.innerText = "⚠️ All patrons must be present!";
        errorSound.play();
        return;
    }

    if (!data.found[0]) {
        message.style.color = "#ff4d4d";
        message.innerText = "🔍 Artefact in the wrong time...";
        errorSound.play();
        return;
    }

    // SUCCESS
    message.style.color = "#00ffae";
    message.innerText = "✅ Correct! Initiating Time Travel Protocols...";
    successSound.play();

    setTimeout(() => {
        window.location.href = "password-entry-2.html";
    }, 1200);
}
</script>

<script>
async function checkState() {
    const res = await fetch("/state");
    const data = await res.json();

    if (data.stage === "holding") {
        window.location.href = "holding.html";
    }
}

setInterval(checkState, 2000);
</script>

</body>
</html>
