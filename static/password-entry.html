<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Escape Room - Stage 1</title>

<style>
body {
    background-color: #0b0f14;
    color: #e6edf3;
    font-family: Arial;
    text-align: center;
    margin-top: 100px;
}

.container {
    background: #111827;
    padding: 30px;
    border-radius: 12px;
    display: inline-block;
}

img {
    width: 180px;
    margin-bottom: 20px;
}

.message {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png">

<h2>Stage 1: Enter Password</h2>

<input type="password" id="password1"><br><br>

<label>
    <input type="checkbox" id="checkbox1">
    All time travellers present
</label>
<br><br>

<button onclick="checkPassword1()">Submit</button>

<div class="message" id="message1"></div>

</div>

<audio id="successSound" src="success.mp3"></audio>
<audio id="errorSound" src="error.mp3"></audio>

<script>
function checkPassword1() {
    const password = document.getElementById("password1").value;
    const checkbox = document.getElementById("checkbox1").checked;
    const message = document.getElementById("message1");

    if (password === "12345") {
        if (!checkbox) {
            message.style.color = "#ff4d4d";
            message.innerText = "⚠️ All time travellers must be present!";
            document.getElementById("errorSound").play();
            return;
        }

        message.style.color = "#00ffae";
        message.innerText = "✅ Correct! Unlocking next stage...";
        document.getElementById("successSound").play();

        setTimeout(() => {
            window.location.href = "password-entry-2.html";
        }, 1200);
    } else {
        message.style.color = "#ff4d4d";
        message.innerText = "❌ Incorrect password...";
        document.getElementById("errorSound").play();
    }
}
</script>

</body>
</html>
